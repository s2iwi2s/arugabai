services:
  bai-postgres:
    image: pgvector/pgvector:0.8.7-pg16
    container_name: bai-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_PASSWORD: testpass123
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 5
      start_period: 5s
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./00_superuser.sql:/tmp/00_superuser.sql

  flyway:
    image: flyway/flyway:12.4.0
    container_name: flyway-migrator
    depends_on:
      bai-postgres:
        condition: service_healthy
    volumes:
      - ./db/migration:/flyway/migrations:ro
    environment:
      FLYWAY_URL: jdbc:postgresql://bai-postgres:5432/arugabai
      FLYWAY_USER: migrator
      FLYWAY_PASSWORD: test-only-password-not-secret
      FLYWAY_DEFAULT_SCHEMA: flyway
      FLYWAY_SCHEMAS: flyway
      FLYWAY_LOCATIONS: filesystem:/flyway/migrations
    command: migrate
